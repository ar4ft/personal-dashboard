name: Deploy dashboard to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Video News commits are pushed with GITHUB_TOKEN, which never triggers `push`; redeploy when that workflow finishes.
  workflow_run:
    workflows: ["Video News"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  # a skipped workflow_run (Video News failed) gets its own group so it never cancels a real deploy
  group: pages-${{ github.ref }}${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && format('-skip-{0}', github.run_id) || '' }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
