name: Video News
# Renders a narrated vertical video for every new news story, hosts the MP4 in ar4ft/dashboard-videos (served by
# jsDelivr) and commits videos.json + posters + captions + scripts back to main. See docs/video-news.md.
on:
  push:
    branches: [main]
    paths: ['public/feed.json', 'video/scripts/**']
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours: catch-up, retention, pin sync
  workflow_dispatch:
    inputs:
      ids:
        description: 'Feed IDs to render (space separated). Empty = recent news without a video.'
        required: false
        default: ''
      max:
        description: 'Max stories per run'
        required: false
        default: '20'
permissions:
  contents: write   # commit videos.json, posters, captions, scripts
  issues: read      # --sync-pins reads "Keep video: <id>" issues
concurrency:
  group: video-news
  cancel-in-progress: false
jobs:
  videos:
    # loop guard: this workflow's own commits (GITHUB_TOKEN pushes do not trigger workflows anyway)
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/Cancun
      GH_TOKEN: ${{ github.token }}
      VIDEOS_REMOTE: git@github.com:ar4ft/dashboard-videos.git
      VIDEO_DISPLAY_FONT: ${{ github.workspace }}/.fonts/BricolageGrotesque.ttf
      VIDEO_UI_FONT: ${{ github.workspace }}/.fonts/Inter.ttf
      WORK: /tmp/video-work
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: video/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: System packages (ffmpeg)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && ffmpeg -version | head -1
      - name: Fonts cache
        uses: actions/cache@v4
        with:
          path: .fonts
          key: fonts-bricolage-inter-v1
      - name: Fonts (Bricolage Grotesque + Inter, OFL, from google/fonts)
        run: |
          mkdir -p .fonts
          [ -s .fonts/BricolageGrotesque.ttf ] || curl -fsSL -o .fonts/BricolageGrotesque.ttf "https://github.com/google/fonts/raw/main/ofl/bricolagegrotesque/BricolageGrotesque%5Bopsz,wdth,wght%5D.ttf"
          [ -s .fonts/Inter.ttf ] || curl -fsSL -o .fonts/Inter.ttf "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf"
      - name: Python deps
        run: pip install -q -r video/requirements.txt   # ingest uses the preinstalled Google Chrome via Playwright
      - run: npm ci
      - name: Deploy key for ar4ft/dashboard-videos
        env:
          KEY: ${{ secrets.VIDEOS_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/videos_key && chmod 600 ~/.ssh/videos_key
          ssh-keyscan -t ed25519 github.com 2>/dev/null > /tmp/gh_host
          fp=$(ssh-keygen -lf /tmp/gh_host | awk '{print $2}')
          [ "$fp" = "SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU" ] || { echo "unexpected github.com host key: $fp"; exit 1; }
          cat /tmp/gh_host >> ~/.ssh/known_hosts
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/videos_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Pick stories
        id: pick
        env:
          IN_IDS: ${{ inputs.ids }}
          IN_MAX: ${{ inputs.max }}
        run: |
          # agents often push the news and then its scripts a few seconds later; let that settle, then use latest main
          if [ "${{ github.event_name }}" = push ]; then sleep 60; fi
          git pull -q --ff-only origin main
          ids="$IN_IDS"
          [ -n "$ids" ] || ids=$(python video/pick_ids.py --days 3 --max "${IN_MAX:-20}")
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "Stories: ${ids:-none}"
      - name: Fetch stories
        if: steps.pick.outputs.ids != ''
        run: python -W ignore video/make.py --ids ${{ steps.pick.outputs.ids }} --ingest-only --work "$WORK" < /dev/null
      - name: Auto scripts for stories without one (extractive, no LLM)
        if: steps.pick.outputs.ids != ''
        run: python video/autoscript.py --ids ${{ steps.pick.outputs.ids }} --work "$WORK" --scripts video/scripts
      - name: Render, upload to jsDelivr, retention, pins, index
        run: |
          python -W ignore video/make.py --ids ${{ steps.pick.outputs.ids }} --scripts video/scripts --work "$WORK" \
            --host jsdelivr --media-clone /tmp/dashboard-videos --retain-days 60 --sync-pins --story-timeout 300 < /dev/null 2>&1 | tee "/tmp/render.log"
          exit ${PIPESTATUS[0]}
      - name: Test and commit (3-way merge of videos.json if main moved)
        if: success() || failure()
        run: |
          S=/tmp/ours; rm -rf $S; mkdir -p $S
          git show HEAD:public/videos.json > $S/base.json
          cp public/videos.json $S/ours.json
          cp -r public/media/videos $S/media
          cp -r video/scripts $S/scripts
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            n=$(python video/merge_manifest.py --base $S/base.json --ours $S/ours.json --ours-media $S/media \
                  --ours-scripts $S/scripts | tee /dev/stderr | tail -1)
            git add public/videos.json public/media/videos video/scripts
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            npm test
            git commit -q -m "Video News: ${n} new video(s) (Actions)"
            git push -q origin HEAD:main && exit 0
            echo "push attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
      - name: Summary
        if: always()
        run: |
          { echo "### Video News"; echo; echo '```'; grep -E '^(rendered|skipped|error|failed|retention|pinned|media index|migrated)' "/tmp/render.log" || echo "no render log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
